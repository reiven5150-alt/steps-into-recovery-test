name: Protected Journey QA
on:
  push:
    branches: [main]
    paths:
      - 'full-journey.html'
      - '.github/workflows/protected-journey-qa.yml'
  workflow_dispatch:
jobs:
  protected-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify paid source is absent from public entrypoint
        shell: bash
        run: |
          test "$(wc -c < full-journey.html)" -lt 15000
          grep -q 'protected-journey-content' full-journey.html
          grep -q 'data-build="11.1.0"' full-journey.html
          if grep -q 'function finishBoss' full-journey.html; then echo 'Game implementation accidentally included in public entrypoint' >&2; exit 1; fi
      - name: Verify unauthorized access is denied
        shell: bash
        run: |
          endpoint='https://yzexencwfirltxnmexcg.supabase.co/functions/v1/protected-journey-content'
          code=$(curl -sS -o /tmp/denied.json -w '%{http_code}' -X POST "$endpoint" -H 'Content-Type: application/json' -d '{"code":"INVALID-UNLICENSED-TEST-ONLY"}')
          test "$code" = "403"
          node -e "const fs=require('fs');let x=JSON.parse(fs.readFileSync('/tmp/denied.json'));if(x.authorized||x.html)process.exit(1)"
