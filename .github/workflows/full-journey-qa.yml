name: Full Journey Public QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'full-journey.html'
      - 'purchase.html'
      - 'facility-staff.html'
      - 'plans.html'
      - 'qa/full-journey.spec.mjs'
      - 'qa/secure-smoke.spec.mjs'
      - '.github/workflows/full-journey-qa.yml'
  workflow_dispatch:

concurrency:
  group: full-journey-qa-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/sih-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/full-journey.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run browser QA
        run: node qa/secure-smoke.spec.mjs
      - name: Verify live customer pages render as HTML
        run: |
          BASE='https://reiven5150-alt.github.io/steps-into-recovery-test'
          ok=0
          for i in {1..18}; do
            all_html=1
            for path in index.html full-journey.html purchase.html facility-staff.html plans.html; do
              headers="$(curl -fsSI "$BASE/$path?v=11.1.0" || true)"
              printf '%s' "$headers" | grep -qi 'content-type:.*text/html' || all_html=0
            done
            body="$(curl -fsS "$BASE/full-journey.html?v=11.1.0" || true)"
            if [ "$all_html" = 1 ] && printf '%s' "$body" | grep -q 'data-build="11.1.0"'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
      - name: Verify legacy Supabase link redirects without source
        run: |
          LEGACY='https://yzexencwfirltxnmexcg.supabase.co/functions/v1/full-journey-access?code=QA-NOT-A-REAL-CUSTOMER-CODE'
          headers="$(curl -sS -D - -o /tmp/legacy-body "$LEGACY")"
          printf '%s' "$headers" | head -n 1 | grep -Eq ' 30[12378] '
          printf '%s' "$headers" | grep -qi '^location: https://reiven5150-alt.github.io/steps-into-recovery-test/full-journey.html'
          printf '%s' "$headers" | grep -qi 'v=11.1.0'
          test ! -s /tmp/legacy-body
          final_headers="$(curl -sSIL "$LEGACY")"
          printf '%s' "$final_headers" | grep -qi 'content-type:.*text/html'
