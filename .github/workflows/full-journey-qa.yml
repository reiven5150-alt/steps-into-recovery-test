name: Full Journey QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'full-journey.html'
      - 'purchase.html'
      - 'facility-staff.html'
      - 'plans.html'
      - 'qa/full-journey.spec.mjs'
      - '.github/workflows/full-journey-qa.yml'
  workflow_dispatch:

concurrency:
  group: full-journey-qa-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/sih-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/full-journey.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run browser QA
        run: node qa/full-journey.spec.mjs
      - name: Verify live GitHub Pages serves HTML build 11.1.0
        run: |
          URL='https://reiven5150-alt.github.io/steps-into-recovery-test/full-journey.html?v=11.1.0'
          ok=0
          for i in {1..18}; do
            headers="$(curl -fsSI "$URL" || true)"
            body="$(curl -fsS "$URL" || true)"
            if printf '%s' "$headers" | grep -qi 'content-type:.*text/html' && printf '%s' "$body" | grep -q 'data-build="11.1.0"'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
