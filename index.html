<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steps Into Recovery — Loading</title><style>html,body{margin:0;height:100%;background:#061b23;color:white;font-family:system-ui;display:grid;place-items:center}.load{padding:24px;text-align:center}.spin{width:42px;height:42px;border:4px solid #28505d;border-top-color:#f1b846;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><b>Loading Steps Into Recovery…</b></div><script>
(async()=>{try{const files=['game/part00.txt','game/part01.txt','game/part02.txt','game/part03.txt','game/part04.txt','game/part05.txt','game/part06.txt'];let html='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);html+=await r.text()}document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><h2>Game failed to load</h2><p>'+String(e)+'</p></div>'}})();
</script></body></html>
